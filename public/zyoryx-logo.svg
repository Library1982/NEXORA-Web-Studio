<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" role="img" aria-labelledby="title desc">
  <title id="title">ZYORYX Digital Solutions</title>
  <desc id="desc">The ZYORYX wordmark framed by two abstract Arabian oryx horns.</desc>
  <defs>
    <linearGradient id="hornGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#hornGradient)" stroke-linecap="round" filter="url(#glow)">
    <path d="M38 104C52 67 83 37 139 18" stroke-width="9"/>
    <path d="M602 104C588 67 557 37 501 18" stroke-width="9"/>
  </g>
  <text x="320" y="96" text-anchor="middle" fill="#f5f7fb" font-family="Manrope,Inter,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="7">ZYORYX</text>
  <text x="320" y="127" text-anchor="middle" fill="#aeb7c7" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="8">DIGITAL SOLUTIONS</text>
</svg>
